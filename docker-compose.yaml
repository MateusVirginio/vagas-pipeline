# Opcional: Postgres para desenvolvimento local; a coleta diária roda no GitHub Actions.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: vagas
      POSTGRES_PASSWORD: vagas
      POSTGRES_DB: vagas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vagas-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagas -d vagas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vagas-db-volume:
